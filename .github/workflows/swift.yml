# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  workflow_dispatch:
  push:
    branches: [ "avr-support-11" ]
  # This is probably more for testing, it might be onerous for live use?
  pull_request:
    branches: [ "avr-support-11" ]

env:
  CI_SERVER: 1
  DEVELOPER_DIR: "/Applications/Xcode-13.2.1.app/Contents/Developer"

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3
    - name: Checkout
      run: checkout-swift-ci.sh
    - name: Build
      run: build-swift-ci.sh
    - name: Archive Built Products
      uses: actions/upload-artifact@v3
      with:
        name: binary directory
        path: ../build/Ninja-ReleaseAssert/swift-macosx-x86_64/bin/
